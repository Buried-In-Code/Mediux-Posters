[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "mdformat >= 1.0.0",
  "mdformat-gfm >= 1.0.0",
  "mdformat-ruff >= 0.1.0",
  "prek >= 0.5.0",
  "ruff >= 0.16.0",
  "toml-sort >= 0.25.0",
  "ty >= 0.0.80",
]
tests = [
  "pytest >= 9.1.0",
  "pytest-cov >= 7.1.0",
  "requests-mock >= 1.12.0",
  "tox >= 4.64.0",
  "tox-uv >= 1.36.0",
]

[project]
authors = [
  { email = "buriedincode@duckpond.nz", name = "BuriedInCode" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet",
  "Typing :: Typed",
]
dependencies = [
  "gql[requests] >= 4.4.0",
  "pydantic >= 2.13.0",
  "questionary >= 2.1.0",
  "requests >= 2.34.0",
  "rich >= 15.0.0",
  "rich-argparse >= 1.8.0",
  "tomli-w >= 1.2.0",
]
description = "Fetches Show, Movie, and Collection cover art from Mediux and updates Plex/Jellyfin using TMDB IDs."
dynamic = ["version"]
keywords = []
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
  { email = "buriedincode@duckpond.nz", name = "BuriedInCode" },
]
name = "mediux-posters"
readme = "README.md"
requires-python = ">= 3.11"

[project.scripts]
Mediux-Posters = "mediux_posters.__main__:main"
mediux-posters = "mediux_posters.__main__:main"

[project.urls]
Homepage = "https://pypi.org/project/Mediux-Posters"
Issues = "https://github.com/Buried-In-Code/Mediux-Posters/issues"
Source = "https://github.com/Buried-In-Code/Mediux-Posters"

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
source = ["mediux_posters"]

[tool.hatch.build.targets.sdist]
exclude = [".github/"]

[tool.hatch.version]
path = "mediux_posters/__init__.py"

[tool.pytest.ini_options]
addopts = ["--cov"]

[tool.ruff]
fix = true
line-length = 100
output-format = "grouped"
show-fixes = true
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "native"
skip-magic-trailing-comma = true

[tool.ruff.lint]
ignore = [
  "COM812",
  "CPY001",
  "D",
  "EM101",
  "EM102",
  "FBT001",
  "FBT002",
  "PLR0913",
  "PLR2004",
  "PLW2901",
  "TC001",
  "TRY003",
  "TRY300",
  "TRY400",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
  "classmethod",
  "pydantic.field_validator",
  "pydantic.model_validator",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
ignore_case = true
overrides."tool.tox.env_list".inline_arrays = false
overrides."tool.tox.testenv.commands".inline_arrays = false
trailing_comma_inline_array = true

[tool.tox]
env_list = ["3.11", "3.12", "3.13", "3.14", "3.15"]
min_version = "4.22"

[tool.tox.env_run_base]
commands = [["pytest"]]
dependency_groups = ["tests"]
passenv = ["JELLYFIN__BASE_URL", "JELLYFIN__TOKEN", "MEDIUX__BASE_URL", "MEDIUX__TOKEN", "PLEX__BASE_URL", "PLEX__TOKEN"]

[tool.ty.src]
exclude = ["**/tests/"]
include = ["**/mediux_posters"]
